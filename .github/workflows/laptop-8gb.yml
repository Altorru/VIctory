name: Laptop 8 GiB

# ONE job on purpose. Four jobs each compiled this workspace from nothing - four
# toolchains, four caches, four times the minutes - and the four answers are the
# same answer: "does the thing this branch changes still build". Here the steps
# share one target directory, so the second and third cost seconds, not minutes.
#
# The repository is public, so none of this is billed; it is still worth being
# cheap, because a CI that takes an hour is a CI nobody waits for.
#
#   check     the workspace compiles for the target it ships to, all targets
#   diag      the diagnostics feature compiles (the frame CSV the plan is read from)
#   test      victory-gpu's own unit tests: reserves, column names, counters
#   artifact  the exe exists at target/diag/victory.exe, where the launcher looks
#   lint      clippy, last and NOT fatal: two warnings predate this branch and a
#             red badge on someone else's two warnings hides the real signal
#
# Skipped entirely for documentation-only changes: `paths-ignore` below. A README
# commit must not compile a game port.

on:
  push:
    branches: [laptop-8gb]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [laptop-8gb]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# A second push cancels the first: the old answer is worthless, and its minutes
# are not refundable.
concurrency:
  group: laptop-8gb-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No incremental artifacts: they are large, they churn the cache key, and a CI
  # checkout has nothing to be incremental against.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: windows build, tests, diag, lint
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup show active-toolchain

      # One cache for the whole job, keyed by Cargo.lock: changed dependencies
      # rebuild, a changed source file does not.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: laptop-8gb
          # Only what the four steps below compile against.
          cache-on-failure: false

      - name: check, all targets
        run: cargo check --workspace --all-targets --locked

      - name: check, diagnostics feature (the frame CSV)
        run: cargo check -p victory --features diagnostics --locked

      - name: test (victory-gpu, lib)
        # Nothing here needs a card, the title or a dump, which is why it can run
        # on a runner at all.
        run: cargo test -p victory-gpu --lib --locked --no-fail-fast
        env:
          RUSTFLAGS: -A warnings

      - name: diag build (the launcher's path)
        run: cargo build --profile diag -p victory --features diagnostics --locked
        env:
          RUSTFLAGS: -A warnings

      - name: the exe is where the launcher looks for it
        shell: pwsh
        run: |
          $exe = "target/diag/victory.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built: Play-VIctory-8GB.cmd picks it up by that path when VICTORY_FRAMES is set" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          "built: $exe ($mb MB)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: victory-diag-${{ github.sha }}
          path: target/diag/victory.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # Last, and not fatal. Reported in the run, never the reason it is red.
      - name: clippy (reported, not fatal)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features --locked --message-format short
        env:
          RUSTFLAGS: -A warnings
