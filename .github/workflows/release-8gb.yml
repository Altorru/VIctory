name: Release 8 GiB

# The CD half: a tag makes the two binaries the launcher can use, and a release
# carries them. Nothing is built from a branch: a tag is a measurement someone
# signed their name to, and the numbers in docs/thirty-fps.md belong to a build.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# What comes out, and why each one:
#   victory-release-vX.exe   smaller and faster; has no frame CSV (`--release`
#                            has no recorder), so it plays but cannot report
#   victory-diag-vX.exe      `--profile diag --features diagnostics`; slower,
#                            writes the frame CSV the plan is built on

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build as a release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-8gb-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -A warnings

jobs:
  build:
    name: build both binaries
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: laptop-8gb-release

      - name: cargo build --release
        run: cargo build --release -p victory --locked
      - name: cargo build --profile diag
        run: cargo build --profile diag -p victory --features diagnostics --locked

      - name: name them for the tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if (-not (Test-Path target/release/victory.exe)) { throw "no release binary" }
          if (-not (Test-Path target/diag/victory.exe)) { throw "no diag binary" }
          Copy-Item target/release/victory.exe "victory-release-$tag.exe"
          Copy-Item target/diag/victory.exe "victory-diag-$tag.exe"
          # A binary next to its own hashes, so nobody has to trust a download.
          Get-FileHash "victory-release-$tag.exe" -Algorithm SHA256 | ForEach-Object { "SHA256  $($_.Hash.ToLower())  victory-release-$tag.exe" } | Set-Content SHA256SUMS.txt
          Get-FileHash "victory-diag-$tag.exe"    -Algorithm SHA256 | ForEach-Object { "SHA256  $($_.Hash.ToLower())  victory-diag-$tag.exe" }    | Add-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: the launcher's supporting files
        shell: pwsh
        run: |
          # The launcher and the plan travel with the binaries: a release that
          # does not say how it was measured is a file, not a result.
          $tag = "${{ inputs.tag || github.ref_name }}"
          if (Test-Path Play-VIctory-8GB.cmd) { Copy-Item Play-VIctory-8GB.cmd "Play-VIctory-8GB-$tag.cmd" }
          if (Test-Path START-8GB.cmd)        { Copy-Item START-8GB.cmd        "START-8GB-$tag.cmd" }
          if (Test-Path docs/thirty-fps.md)   { Copy-Item docs/thirty-fps.md "thirty-fps-$tag.md" }

      - uses: actions/upload-artifact@v4
        with:
          name: victory-8gb-${{ inputs.tag || github.ref_name }}
          path: |
            victory-release-*.exe
            victory-diag-*.exe
            SHA256SUMS.txt
            Play-VIctory-8GB-*.cmd
            START-8GB-*.cmd
            thirty-fps-*.md
          if-no-files-found: error
          retention-days: 90

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: |
            ## Run it in four steps

            1. Download **`victory-diag-<tag>.exe`** and **`START-8GB-<tag>.cmd`**.
            2. Put both in the folder that holds your own copy of the title
               (`game_scarlett_master.exe`).
            3. Rename `victory-diag-<tag>.exe` to **`victory.exe`**.
            4. Double-click **`START-8GB-<tag>.cmd`**. It asks once for the title's
               folder if it cannot find it, records the run to a CSV, makes the
               pipelines ahead of time, and starts the game at 1080p.

            When it ends it prints the CSV path: send that file back, plus a
            screenshot of the world (not a menu). That is the whole ask.

            ## What the two binaries are

            - **`victory-diag-*.exe`** — the one the numbers come from. It writes the
              frame CSV and the card's own spans; it is slower than the plain build,
              and it is what this fork is for.
            - **`victory-release-*.exe`** — the same code without the recorder: smaller,
              faster, and unable to report anything. For playing, not measuring.

            `Play-VIctory-8GB-*.cmd` is the launcher behind the double-click: sizes
            `4k`/`1440p`/`1080p`/`936p`/`720p`, `perf` for the three switches that move
            waits, `60` to lift the title's own 30 fps interval, and `warm` alone to make
            the pipelines without playing. `thirty-fps-*.md` is the plan: the four builds
            it is built on, the arithmetic, and what would falsify it.

            Windows 10 2004 or later, a recent NVIDIA driver, 16 GB of RAM or more.
            Nothing of the game and nothing of NVIDIA's is in these files.
          files: |
            victory-release-*.exe
            victory-diag-*.exe
            SHA256SUMS.txt
            Play-VIctory-8GB-*.cmd
            START-8GB-*.cmd
            thirty-fps-*.md
          fail_on_unmatched_files: false
