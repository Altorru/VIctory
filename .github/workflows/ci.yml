name: CI

# This fork's own CI is `.github/workflows/laptop-8gb.yml`: one job, on the
# branch that ships, with the diagnostics build and the tests that belong to it.
# This file is upstream's, kept but narrowed: it ran on EVERY pull request, and its
# `clippy -D warnings` fails on two warnings that predate this fork (a
# `.is_multiple_of()` in victory-formats, a collapsible `if` in victory-gpu's build
# script). A pull request against laptop-8gb would have shown a red badge for
# someone else's two lines, so it now runs only on main and by hand.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
